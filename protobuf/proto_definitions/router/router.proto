syntax = "proto3";
package qaul.rpc.router;


// router rpc message container
message Router {
    oneof message {
        RoutingTableRequest routing_table_request = 1;
        RoutingTableList routing_table = 2;
        ConnectionsRequest connections_request = 3;
        ConnectionsList connections_list = 4;
        NeighboursRequest neighbours_request = 5;
        NeighboursList neighbours_list = 6;
        // router_v2 native views. See docs/proposals/v1-to-v2-cutover.md §8.
        RouterV2Request router_v2_request = 7;
        RouterV2Status router_v2_status = 8;
        RouterV2Table router_v2_table = 9;
        RouterV2Neighbours router_v2_neighbours = 10;
    }
}

// Connection modules
enum ConnectionModule {
    NONE = 0;
    LAN = 1;
    INTERNET = 2;
    BLE = 3;
    LOCAL = 4;
}


// UI request for routing table list
message RoutingTableRequest {

}

// Routing table list
// This table presents the best view for each user.
// It represents the decision the router takes
// when sending and routing packages
message RoutingTableList {
    repeated RoutingTableEntry routing_table = 1;
}

// Routing table user entry
// This message contains the best connection to this
// user per module
message RoutingTableEntry {
    bytes user_id = 1;
    repeated RoutingTableConnection connections = 2;
}

// Routing table connection entry.
// This message contains a connection to a specific user.
message RoutingTableConnection {
    // the connection module (LAN, Internet, BLE, etc.)
    ConnectionModule module = 2;
    // the round trip time for this connection
    uint32 rtt = 3;
    // hop count
    uint32 hop_count = 5;
    // node id via which this connection is routed
    bytes via = 4;
}


// UI request for connections list
message ConnectionsRequest {

}

// Connections list per module.
// All connections per user per module.
message ConnectionsList {
    // users connected via the LAN module
    repeated ConnectionsUserEntry lan = 1;
    // users connected via the Internet module
    repeated ConnectionsUserEntry internet = 2;
    // users connected via the BLE module
    repeated ConnectionsUserEntry ble = 3;
    // users connected locally (on the same node)
    repeated ConnectionsUserEntry local = 4;
}

// connections entry for a user
message ConnectionsUserEntry {
    // the id of the user
    bytes user_id = 1;
    // all connections to this user via this module
    repeated ConnectionEntry connections = 2;
}

// all connections of this user
message ConnectionEntry {
    // round trip time in milli seconds
    uint32 rtt = 1;
    // hop count to the user.
    // This represents the number of nodes between this node and the user.
    uint32 hop_count = 2;
    // connection can be established via the node with the following id
    bytes via = 3;
}


// UI request for neighbours list
message NeighboursRequest {

}

// neighbours list per module
message NeighboursList {
    repeated NeighboursEntry lan = 1;
    repeated NeighboursEntry internet = 2;
    repeated NeighboursEntry ble = 3;
}

// neighbours entry
message NeighboursEntry {
    // the ID of the neighbour node
    bytes node_id = 1;
    // rtt to this neighbour
    uint32 rtt = 2;
}


// ---------------------------------------------------------------------------
// router_v2 native views
//
// v2 holds state that has no v1 shape: two index spaces, a path metric rather
// than a round-trip time, the local_only sphere flag, per-neighbour mirror
// dictionaries. These messages expose it directly rather than flattening it
// into the v1 routing table. See docs/proposals/v1-to-v2-cutover.md §8.
// ---------------------------------------------------------------------------

// which v2 view the client wants
message RouterV2Request {
    RouterV2View view = 1;
}

enum RouterV2View {
    STATUS = 0;
    TABLE = 1;
    NEIGHBOURS = 2;
}

// the two independent index spaces of spec section 3.5
enum IndexSpace {
    USER_SPACE = 0;
    NODE_SPACE = 1;
}

// what this node currently is
message RouterV2Status {
    // 8-byte routing id, sha256(multikey)[..8] per spec section 3.3
    bytes node_id = 1;
    // propagation form, spec section 3.2: false = user entry, true = node entry
    bool is_node_form = 2;
    // gateway role, spec section 2.3
    bool is_gateway = 3;
    // this node's sequence number, spec section 6
    uint32 seq_num = 4;
    // own committed manifest version, spec section 10.8
    uint32 manifest_version = 5;
    uint32 manifest_entries = 6;
    // oldest servable version in the delta log, spec section 10.9
    uint32 manifest_log_base = 7;
    uint32 neighbours = 8;
    uint32 user_entries = 9;
    uint32 node_entries = 10;
    uint32 user_dict_size = 11;
    uint32 node_dict_size = 12;
    // indexes awaiting re-introduction, spec section 3.8
    uint32 pending_user_intros = 13;
    uint32 pending_node_intros = 14;
    // spec section 11.5 fetches awaiting a response
    uint32 profile_fetches_in_flight = 15;
    // spec section 10.8 pulls awaiting a response
    uint32 manifest_requests_outstanding = 16;
}

// the real v2 routing table, both index spaces
message RouterV2Table {
    repeated RouterV2Entry entries = 1;
}

message RouterV2Entry {
    IndexSpace space = 1;
    // our own index for this target, spec section 3.5
    uint32 index = 2;
    bytes target_id = 3;
    uint32 seq_num = 4;
    // accumulated path cost, spec section 5
    uint32 metric = 5;
    // masked to the low six bits, spec section 7.4
    uint32 hop_count = 6;
    // reached only over Local-sphere transports, spec section 7.4
    bool local_only = 7;
    uint32 next_hop_index = 8;
    bytes next_hop_id = 9;
    ConnectionModule transport = 10;
    // milliseconds since this entry was last refreshed
    uint64 age_ms = 11;
}

message RouterV2Neighbours {
    repeated RouterV2Neighbour neighbours = 1;
}

message RouterV2Neighbour {
    bytes peer_id = 1;
    bytes node_id = 2;
    // a neighbour may be reachable on several transports, spec section 4.2
    repeated ConnectionModule transports = 3;
    // real ping measurement, unlike the path metric
    uint32 rtt_micros = 4;
    // mirror dictionary sizes, spec section 3.6. A small mirror against a
    // large peer dictionary is what produces UnknownMapping drops.
    uint32 user_mirror_size = 5;
    uint32 node_mirror_size = 6;
    // bindings an in-flight INDEX_DUMP has not yet confirmed, spec section 8.4
    uint32 dump_stale_users = 7;
    uint32 dump_stale_nodes = 8;
}
